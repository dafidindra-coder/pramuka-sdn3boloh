<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d4037">
<link rel="manifest" href="manifest.json">
<title>Barung — Pramuka SDN 3 Boloh</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head><body>
<header id="nav"></header>
<main>
  <nav id="subnav"></nav>
  <div><div class="label" id="sub"></div><h1>Barung</h1></div>
  <div id="pilih-gudep" hidden><label for="gudep">Gudep</label><select id="gudep"><option value="">Semua Gudep</option><option value="05.093">05.093 Putra</option><option value="05.122">05.122 Putri</option></select></div>
  <div class="grid" id="ringkasan"></div>
  <div id="daftar" style="display:flex;flex-direction:column;gap:12px"><div class="kerangka"></div><div class="kerangka"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="sku.js"></script>
<script>
(async()=>{
  const p=await butuhLogin(['pembina','mabigus']); if(!p) return;
  const $=id=>document.getElementById(id);
  if(p.role==='pembina') subNav($('subnav'),[['anggota.html','Daftar siswa'],['barung.html','Barung'],['pelantikan.html','Pelantikan']]);
  else {$('subnav').remove();$('pilih-gudep').hidden=false}
  const [siswa]=await Promise.all([ambilSiswa(p),muatMateriSku()]);
  const ids=siswa.map(s=>s.id), kosong={data:[],error:null};
  const [abs,sku]=await Promise.all(ids.length?[
    db.from('absensi_mingguan').select('siswa_id,tanggal,status').in('siswa_id',ids),
    db.from('pencapaian_sku').select('siswa_id,kode_sku').in('siswa_id',ids)]:[kosong,kosong]);
  if(abs.error||sku.error){tampilError($('daftar'),'Data barung gagal dimuat',abs.error||sku.error);return}

  // Ringkasan per siswa
  const info=Object.fromEntries(siswa.map(s=>{
    const a=abs.data.filter(r=>r.siswa_id===s.id), h=a.filter(r=>r.status==='H').length;
    const st=statusSiswaSku(s,new Set(sku.data.filter(r=>r.siswa_id===s.id).map(r=>r.kode_sku)));
    return [s.id,{pct:a.length?Math.round(h/a.length*100):null,hadir:h,total:a.length,...st}];
  }));

  function gambar(){
    const g=p.role==='mabigus'?$('gudep').value:p.gudep;
    $('sub').textContent=namaGudep(g||null);
    const daftar=siswa.filter(s=>!g||s.gudep===g);
    const kelompok={};
    daftar.forEach(s=>{const k=(s.barung?s.barung:'')+'|'+s.gudep;(kelompok[k]=kelompok[k]||[]).push(s)});
    const urut=Object.entries(kelompok).sort(([a],[b])=>(a.startsWith('|')?1:0)-(b.startsWith('|')?1:0)||a.localeCompare(b));
    const jmlBarung=urut.filter(([k])=>!k.startsWith('|')).length, tanpa=daftar.filter(s=>!s.barung).length;
    $('ringkasan').innerHTML=`<div class="card"><div class="label">Barung</div><div class="stat">${jmlBarung}</div><div class="muted">${daftar.length} siswa aktif</div></div>
      <div class="card"><div class="label">Belum punya barung</div><div class="stat">${tanpa}</div><div class="muted">${tanpa?(p.role==='pembina'?'atur di Daftar siswa':'minta pembina mengatur'):'semua sudah terbagi'}</div></div>`;
    $('daftar').innerHTML=urut.length?urut.map(([k,anggota])=>{
      const [nama,gudep]=k.split('|');
      const t=anggota.reduce((x,s)=>x+info[s.id].total,0), h=anggota.reduce((x,s)=>x+info[s.id].hadir,0), siap=anggota.filter(s=>info[s.id].siap).length;
      return `<section class="card barung"><div class="kepala-bagian" style="margin:0"><div style="display:flex;gap:10px;align-items:center">
          <span class="bendera" style="--warna:${warnaBarung(nama)}" aria-hidden="true">${ikon('barung')}</span>
          <div><h2>${nama?'Barung '+esc(nama):'Belum punya barung'}</h2><div class="muted">${anggota.length} anggota${p.role==='mabigus'&&!g?' · '+esc(GUDEP[gudep]||gudep):''}</div></div></div>
          <div style="text-align:right"><b style="font-variant-numeric:tabular-nums">${t?Math.round(h/t*100):0}%</b><div class="muted">hadir</div></div></div>
        ${siap?`<p style="margin-top:8px"><span class="pil kuning">${siap} siap dilantik</span></p>`:''}
        <ul class="daftar" style="margin-top:8px">${anggota.map(s=>{const x=info[s.id], pr=x.pr[x.tk];
          return `<li><div style="flex:1"><div class="kepala-bagian" style="margin:0"><b>${esc(s.nama)}</b><span class="muted">${x.pct==null?'—':x.pct+'%'}</span></div>
            <div class="muted" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${esc(TINGKAT[x.tk])} · SKU ${pr.lulus}/${pr.total}${s.kelas?' · Kelas '+esc(s.kelas):''}</div>
            <div class="progres ${skuPenuh(pr)?'penuh':''}" style="margin-top:4px;height:6px"><i style="width:${lebarPersen(pr)}%"></i></div></div>
            ${p.role==='pembina'?`<a class="tombol-hapus" style="display:grid;place-items:center;text-decoration:none" href="anggota.html#ubah-${encodeURIComponent(s.id)}" aria-label="Ubah ${esc(s.nama)}">Ubah</a>`:''}</li>`}).join('')}</ul></section>`}).join('')
      :'<div class="kosong"><b>Belum ada siswa</b></div>';
  }
  // Warna bendera barung dari namanya (Merah, Biru, ...) bila cocok
  function warnaBarung(n){
    const w={merah:'#c62828',biru:'#1565c0',hijau:'#2e7d32',kuning:'#f9a825',putih:'#e0e0e0',hitam:'#37474f',coklat:'#6d4c41',jingga:'#ef6c00',ungu:'#6a1b9a',
      mawar:'#d81b60',melati:'#e0e0e0',anggrek:'#8e24aa',kenanga:'#c0ca33'}[String(n).toLowerCase()];
    return w||'#8d6e63';
  }
  $('gudep').onchange=gambar; gambar();
})();
</script></body></html>
