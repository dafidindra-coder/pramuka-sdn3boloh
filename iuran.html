<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d4037">
<link rel="manifest" href="manifest.json">
<title>Iuran &amp; Kas — Pramuka SDN 3 Boloh</title>
<link rel="stylesheet" href="style.css?v=20261127c">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head><body>
<header id="nav"></header>
<main>
  <div><div class="label" id="sub"></div><h1>Iuran &amp; kas</h1></div>
  <div class="tab" role="tablist">
    <button role="tab" id="tab-iuran" aria-selected="true" aria-controls="panel-iuran">Iuran</button>
    <button role="tab" id="tab-setoran" aria-selected="false" aria-controls="panel-setoran">Setoran</button>
    <button role="tab" id="tab-kas" aria-selected="false" aria-controls="panel-kas">Kas keluar</button>
  </div>

  <!-- ===== Iuran bulanan per kelas ===== -->
  <section id="panel-iuran" role="tabpanel" aria-labelledby="tab-iuran" style="display:flex;flex-direction:column;gap:10px">
    <div id="info-guru"></div>
    <div class="baris-form">
      <div><label for="kelas">Kelas</label><select id="kelas"></select></div>
      <div><label for="thn">Tahun</label><input type="number" id="thn" inputmode="numeric"></div>
    </div>
    <div><label for="cari">Cari siswa</label><input id="cari" type="search" placeholder="Ketik nama…"></div>
    <p class="muted" id="petunjuk"></p>
    <div id="daftar" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <!-- ===== Setoran guru kelas ke kas Gudep ===== -->
  <section id="panel-setoran" role="tabpanel" aria-labelledby="tab-setoran" hidden style="display:flex;flex-direction:column;gap:12px">
    <p class="muted">Guru kelas mengumpulkan iuran kelasnya, lalu menyetorkannya ke kas Gudep siswa (Putra atau Putri). Setoran dikonfirmasi oleh pembina Gudep itu atau mabigus.</p>
    <div class="geser"><table id="tabel-kelas"></table></div>
    <form id="form-setor" class="card" hidden>
      <h2 id="judul-setor">Catat setoran</h2>
      <div class="baris-form">
        <div><label for="s-gudep">Setor ke</label><select id="s-gudep"></select></div>
        <div><label for="s-tgl">Tanggal</label><input type="date" id="s-tgl" required></div>
        <div><label for="s-jml">Jumlah (Rp)</label><input type="number" id="s-jml" inputmode="numeric" min="1" step="1" required></div>
      </div>
      <label for="s-ket">Keterangan (opsional)</label><input id="s-ket" maxlength="100" placeholder="mis. Iuran Juli–September">
      <button class="btn" style="margin-top:12px">Catat setoran</button>
    </form>
    <section class="card"><div class="kepala-bagian"><h2>Riwayat setoran</h2><span class="pil" id="jml-menunggu"></span></div><div id="riwayat-setoran" style="margin-top:6px"></div></section>
  </section>

  <!-- ===== Kas keluar ===== -->
  <section id="panel-kas" role="tabpanel" aria-labelledby="tab-kas" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="grid" id="saldo"></div>
    <form id="form-kas" class="card">
      <h2>Catat pengeluaran</h2>
      <div class="baris-form">
        <div><label for="k-tgl">Tanggal</label><input type="date" id="k-tgl" required></div>
        <div><label for="k-jml">Jumlah (Rp)</label><input type="number" id="k-jml" inputmode="numeric" min="1" step="1" required placeholder="25000"></div>
      </div>
      <label for="k-ket">Keperluan</label><input id="k-ket" required maxlength="100" placeholder="mis. Tali pramuka 10 gulung">
      <button class="btn" style="margin-top:12px">Simpan pengeluaran</button>
    </form>
    <section class="card"><h2>Riwayat pengeluaran</h2><div id="riwayat" style="margin-top:6px"></div></section>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261127c"></script>
<script>
(async()=>{
  const p=await butuhLogin(['pembina']); if(!p) return;
  const $=id=>document.getElementById(id);
  const thn=$('thn'), box=$('daftar'), cari=$('cari'), pilihKelas=$('kelas');
  const kelasSaya=normKelas(p.kelas);   // kelas yang dipegang pembina ini sebagai guru kelas
  $('sub').textContent=namaGudep(p.gudep)+(kelasSaya?' · Guru kelas '+kelasSaya:'');
  thn.value=new Date().getFullYear(); $('k-tgl').value=hariIni(); $('s-tgl').value=hariIni();
  // Siswa Gudep sendiri, ditambah siswa kelas yang dipegang (guru kelas) dari Gudep lain
  const siswaGudep=await ambilSiswa(p);
  let siswaLain=[];
  if(kelasSaya){
    const {data}=await db.from('profil_pengguna').select('*').eq('role','siswa').neq('gudep',p.gudep).order('nama');
    siswaLain=(data||[]).filter(s=>s.aktif!==false&&normKelas(s.kelas)===kelasSaya);
  }
  const siswa=[...siswaGudep,...siswaLain].sort((a,b)=>a.nama.localeCompare(b.nama,'id')), ids=siswa.map(s=>s.id);
  const labelGudep=g=>g===p.gudep?'':' · '+(GUDEP[g]?'Gudep '+GUDEP[g]:namaGudep(g));
  const semuaKelas=[...new Set(siswa.map(s=>normKelas(s.kelas)||'—'))].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
  let peta={};

  /* ---- Tab ---- */
  const TAB=['iuran','setoran','kas'];
  function pilihTab(t){
    TAB.forEach(x=>{$('tab-'+x).setAttribute('aria-selected',x===t);$('panel-'+x).hidden=x!==t});
    if(t==='setoran') muatSetoran(); if(t==='kas') muatKas();
  }
  TAB.forEach(t=>$('tab-'+t).onclick=()=>pilihTab(t));

  /* ---- Iuran bulanan ---- */
  pilihKelas.innerHTML='<option value="">Semua kelas</option>'+semuaKelas.map(k=>`<option value="${esc(k)}">Kelas ${esc(k)}${k===kelasSaya?' (kelas Anda)':''}</option>`).join('');
  pilihKelas.value=kelasSaya&&semuaKelas.includes(kelasSaya)?kelasSaya:'';
  $('info-guru').innerHTML=kelasSaya
    ?`<p class="info">Anda guru kelas <b>${esc(kelasSaya)}</b>. Iuran semua siswa kelas ini (putra dan putri) Anda yang mencatat; kelas lain hanya bisa dilihat.</p>`
    :`<p class="info">Anda belum ditetapkan sebagai guru kelas, jadi iuran hanya bisa dilihat. Minta mabigus mengisi kelas Anda di menu Pembina.</p>`;
  const bolehUbah=s=>!!kelasSaya&&normKelas(s.kelas)===kelasSaya;

  function gambar(){
    const q=cari.value.trim().toLowerCase(), k=pilihKelas.value, tahunIni=+thn.value===new Date().getFullYear(), bln=new Date().getMonth();
    const list=siswa.filter(s=>(!k||(normKelas(s.kelas)||'—')===k)&&s.nama.toLowerCase().includes(q));
    const ubah=list.some(bolehUbah);
    $('petunjuk').textContent=ubah?`Ketuk bulan untuk menandai lunas. Iuran ${rupiah(IURAN_PER_BULAN)} per bulan.`:`Iuran ${rupiah(IURAN_PER_BULAN)} per bulan. Tampilan ini hanya untuk dilihat.`;
    if(!siswa.length){box.innerHTML='<div class="kosong"><b>Belum ada siswa di Gudep ini</b><span>Tambahkan siswa di menu <a href="anggota.html">Anggota</a>.</span></div>';return}
    if(!list.length){box.innerHTML='<div class="kosong"><b>Tidak ada siswa yang cocok</b></div>';return}
    box.innerHTML=list.map(s=>{const r=peta[s.id]||{}, n=BULAN.filter(b=>r[b]).length, boleh=bolehUbah(s);
      return `<div class="card ${boleh?'':'hanya-lihat'}" data-id="${esc(s.id)}"><div class="siswa-kepala"><div class="dengan-foto">${avatar(s,40)}<div><b>${esc(s.nama)}</b>
          <div class="muted">${s.kelas?'Kelas '+esc(s.kelas):esc(s.nis_nip)}${esc(labelGudep(s.gudep))}${boleh?'':' · hanya lihat'}</div></div></div>
        <span class="pil ${n===12?'hijau':''}" data-jml>${n}/12</span></div>
        <div class="bulan12">${BULAN.map((b,i)=>`<button type="button" data-b="${b}" class="${r[b]?'lunas':(tahunIni&&i<=bln?'telat':'')}" aria-pressed="${!!r[b]}" ${boleh?'':'disabled'}
          aria-label="${NAMA_BULAN[i]} ${r[b]?'lunas':'belum'}">${NAMA_BULAN[i]}</button>`).join('')}</div></div>`}).join('');
  }
  async function muat(){
    box.innerHTML='<div class="kerangka"></div><div class="kerangka"></div>';
    if(!ids.length){peta={};gambar();return}
    const {data,error}=await db.from('iuran_bulanan').select('*').eq('tahun',+thn.value).in('siswa_id',ids);
    if(error){tampilError(box,'Iuran gagal dimuat',error);return}
    peta=Object.fromEntries(data.map(r=>[r.siswa_id,r])); gambar();
  }
  box.addEventListener('click',async e=>{
    const b=e.target.closest('button[data-b]'); if(!b||b.disabled) return;
    const kartu=b.closest('.card'), id=kartu.dataset.id, bln=b.dataset.b, nilai=!b.classList.contains('lunas');
    const ubah=v=>{b.classList.toggle('lunas',v);b.setAttribute('aria-pressed',v);peta[id]={...(peta[id]||{}),[bln]:v};
      const n=BULAN.filter(x=>peta[id][x]).length, pil=kartu.querySelector('[data-jml]');pil.textContent=n+'/12';pil.classList.toggle('hijau',n===12)};
    ubah(nilai);   // tampil dulu, batalkan jika gagal
    const {error}=await db.from('iuran_bulanan').upsert({siswa_id:id,tahun:+thn.value,[bln]:nilai},{onConflict:'siswa_id,tahun'});
    if(error){ubah(!nilai);toast(/row-level security/i.test(error.message)?'Hanya guru kelas siswa ini yang bisa mencatat iurannya':'Gagal: '+error.message)}
  });
  thn.addEventListener('change',muat); cari.addEventListener('input',gambar); pilihKelas.addEventListener('change',gambar); muat();

  /* ---- Perhitungan uang per kelas (semua tahun) ---- */
  async function dataUang(){
    const [iur,str,klr]=await Promise.all([
      ids.length?db.from('iuran_bulanan').select('*').in('siswa_id',ids):{data:[],error:null},
      db.from('setoran_iuran').select('*').order('tanggal',{ascending:false}),   // aturan akses: Gudep sendiri + setoran sendiri
      db.from('kas_keluar').select('*').eq('gudep',p.gudep).order('tanggal',{ascending:false})]);
    // Terkumpul per Gudep dan kelas (kunci "gudep|kelas"): uang iuran masuk ke kas Gudep siswanya
    const kunciDari=Object.fromEntries(siswa.map(s=>[s.id,s.gudep+'|'+(normKelas(s.kelas)||'—')]));
    const terkumpul={};
    (iur.data||[]).forEach(r=>{const k=kunciDari[r.siswa_id];if(k) terkumpul[k]=(terkumpul[k]||0)+BULAN.filter(b=>r[b]).length*IURAN_PER_BULAN});
    return {iur,str,klr,terkumpul};
  }
  const kunciSetoran=r=>r.gudep+'|'+normKelas(r.kelas);
  const jumlahSetoran=(list,k,status)=>list.filter(r=>(!k||kunciSetoran(r)===k)&&r.status===status).reduce((n,r)=>n+r.jumlah,0);
  const namaKunci=k=>{const [g,kl]=k.split('|');return 'Kelas '+kl+labelGudep(g)};

  /* ---- Setoran ---- */
  async function muatSetoran(){
    const rw=$('riwayat-setoran'); rw.innerHTML='<div class="kerangka"></div>';
    const {str,terkumpul}=await dataUang();
    if(str.error){tampilError(rw,'Setoran gagal dimuat',str.error);$('tabel-kelas').innerHTML='';return}
    const list=str.data, urut=(a,b)=>(a.startsWith(p.gudep)?0:1)-(b.startsWith(p.gudep)?0:1)||a.localeCompare(b,'id',{numeric:true});
    const kunciList=[...new Set([...Object.keys(terkumpul),...list.map(kunciSetoran)])].sort(urut);
    const baris=kunciList.map(k=>{const t=terkumpul[k]||0, d=jumlahSetoran(list,k,'diterima'), m=jumlahSetoran(list,k,'menunggu');
      return {k,kelas:k.split('|')[1],gudep:k.split('|')[0],t,d,m,b:t-d-m}});
    const tot=baris.reduce((a,r)=>({t:a.t+r.t,d:a.d+r.d,m:a.m+r.m,b:a.b+r.b}),{t:0,d:0,m:0,b:0});
    $('tabel-kelas').innerHTML=`<thead><tr><th>Kelas</th><th>Terkumpul</th><th>Diterima</th><th>Menunggu</th><th>Belum disetor</th></tr></thead><tbody>`+
      baris.map(r=>`<tr class="${r.kelas===kelasSaya?'baris-saya':''}"><td>${esc(r.kelas)}${esc(labelGudep(r.gudep).replace(' · ',' '))}${r.kelas===kelasSaya?' <span class="pil">Anda</span>':''}</td><td>${rupiah(r.t)}</td><td>${rupiah(r.d)}</td><td>${r.m?rupiah(r.m):'—'}</td>
        <td>${r.b>0?`<b>${rupiah(r.b)}</b>`:rupiah(r.b)}</td></tr>`).join('')+
      `<tr><td><b>Total</b></td><td><b>${rupiah(tot.t)}</b></td><td><b>${rupiah(tot.d)}</b></td><td>${tot.m?rupiah(tot.m):'—'}</td><td><b>${rupiah(tot.b)}</b></td></tr></tbody>`;
    // Formulir hanya untuk guru kelas
    $('form-setor').hidden=!kelasSaya;
    if(kelasSaya){
      // Tujuan setoran: kas Gudep siswa (kelas yang sama bisa ada di Gudep Putra dan Putri)
      const tujuan=baris.filter(r=>r.kelas===kelasSaya);
      if(!tujuan.length) tujuan.push({gudep:p.gudep,b:0});
      const pilih=$('s-gudep'), sebelum=pilih.value;
      pilih.innerHTML=tujuan.map(r=>`<option value="${esc(r.gudep)}" data-sisa="${r.b}">Kas ${esc(namaGudep(r.gudep))} — belum disetor ${rupiah(Math.max(r.b,0))}</option>`).join('');
      if(tujuan.some(r=>r.gudep===sebelum)) pilih.value=sebelum; else { const ada=tujuan.find(r=>r.b>0); if(ada) pilih.value=ada.gudep; }
      $('judul-setor').textContent=`Catat setoran kelas ${kelasSaya}`;
      const sisa=+pilih.selectedOptions[0].dataset.sisa;
      if(!$('s-jml').value&&sisa>0) $('s-jml').value=sisa;
    }
    const menunggu=list.filter(r=>r.status==='menunggu').length;
    $('jml-menunggu').textContent=menunggu?`${menunggu} menunggu`:'';$('jml-menunggu').hidden=!menunggu;
    rw.innerHTML=list.length?`<ul class="daftar">${list.map(r=>{const milikSaya=r.disetor_oleh===p.id;
      return `<li><div><b>Kelas ${esc(normKelas(r.kelas))} · ${rupiah(r.jumlah)}</b><div class="muted">Kas ${esc(namaGudep(r.gudep))} · ${esc(tglPanjang(r.tanggal))}${r.keterangan?' · '+esc(r.keterangan):''}</div></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${r.status==='diterima'?'<span class="pil hijau">Diterima</span>':'<span class="pil kuning">Menunggu</span>'}
        ${r.status==='menunggu'&&!milikSaya&&r.gudep===p.gudep?`<button class="btn kecil" data-terima="${esc(r.id)}" type="button">Terima</button>`:''}
        ${r.status==='menunggu'&&milikSaya?`<button class="tombol-hapus" data-batal="${esc(r.id)}" type="button">Batalkan</button>`:''}</div></li>`}).join('')}</ul>`
      :'<p class="muted">Belum ada setoran.</p>';
  }
  $('riwayat-setoran').addEventListener('click',async e=>{
    const t=e.target.closest('[data-terima]'), b=e.target.closest('[data-batal]');
    if(t){
      if(t.dataset.yakin!=='1'){t.dataset.yakin='1';t.textContent='Uang sudah diterima?';setTimeout(()=>{t.dataset.yakin='';t.textContent='Terima'},3500);return}
      t.disabled=true;
      const {error}=await db.rpc('terima_setoran',{p_id:t.dataset.terima});
      if(error){t.disabled=false;return toast('Gagal: '+error.message)}
      toast('Setoran diterima, masuk ke kas Gudep'); muatSetoran();
    } else if(b){
      if(b.dataset.yakin!=='1'){b.dataset.yakin='1';b.textContent='Batalkan?';setTimeout(()=>{b.dataset.yakin='';b.textContent='Batalkan'},3000);return}
      const {error}=await db.from('setoran_iuran').delete().eq('id',b.dataset.batal);
      if(error) return toast('Gagal membatalkan: '+error.message);
      toast('Setoran dibatalkan'); muatSetoran();
    }
  });
  $('s-gudep').addEventListener('change',()=>{const sisa=+$('s-gudep').selectedOptions[0].dataset.sisa;$('s-jml').value=sisa>0?sisa:''});
  $('form-setor').addEventListener('submit',async e=>{
    e.preventDefault();
    const {error}=await db.from('setoran_iuran').insert({gudep:$('s-gudep').value,kelas:kelasSaya,tanggal:$('s-tgl').value,
      jumlah:Math.round(+$('s-jml').value),keterangan:$('s-ket').value.trim()||null,disetor_oleh:p.id,status:'menunggu'});
    if(error) return toast('Gagal mencatat setoran: '+error.message);
    $('s-jml').value='';$('s-ket').value='';toast('Setoran dicatat, menunggu konfirmasi');muatSetoran();
  });

  /* ---- Kas keluar ---- */
  async function muatKas(){
    const riwayat=$('riwayat');
    riwayat.innerHTML='<div class="kerangka"></div>';
    const {str,klr,terkumpul}=await dataUang();
    if(klr.error){tampilError(riwayat,'Kas keluar gagal dimuat',klr.error);$('saldo').innerHTML='';return}
    const keluar=klr.data.reduce((n,r)=>n+(r.jumlah||0),0);
    // Kas dihitung untuk Gudep sendiri saja
    const total=Object.entries(terkumpul).filter(([k])=>k.startsWith(p.gudep+'|')).reduce((a,[,v])=>a+v,0);
    // Bila tabel setoran belum ada (SQL lama), pakai cara hitung lama: semua iuran dianggap kas
    const diterima=str.error?total:str.data.filter(r=>r.gudep===p.gudep&&r.status==='diterima').reduce((n,r)=>n+r.jumlah,0);
    $('saldo').innerHTML=`<div class="card"><div class="label">Kas Gudep</div><div class="stat">${rupiah(diterima-keluar)}</div><div class="muted">setoran diterima ${rupiah(diterima)} − keluar</div></div>
      <div class="card"><div class="label">Masih di guru kelas</div><div class="stat" style="color:var(--teks-2)">${rupiah(total-diterima)}</div><div class="muted">iuran belum disetor / menunggu</div></div>
      <div class="card"><div class="label">Keluar</div><div class="stat" style="color:var(--merah)">${rupiah(keluar)}</div><div class="muted">${klr.data.length} pengeluaran</div></div>`;
    riwayat.innerHTML=klr.data.length?`<ul class="daftar">${klr.data.map(r=>`<li><div><b>${esc(r.keterangan)}</b><div class="muted">${esc(tglPanjang(r.tanggal))}</div></div>
      <div style="display:flex;gap:8px;align-items:center"><b style="font-variant-numeric:tabular-nums">${rupiah(r.jumlah)}</b><button class="tombol-hapus" data-id="${esc(r.id)}" aria-label="Hapus ${esc(r.keterangan)}">✕</button></div></li>`).join('')}</ul>`
      :'<p class="muted">Belum ada pengeluaran yang dicatat.</p>';
  }
  $('riwayat').addEventListener('click',async e=>{
    const b=e.target.closest('.tombol-hapus'); if(!b) return;
    if(b.dataset.yakin!=='1'){b.dataset.yakin='1';b.textContent='Hapus?';setTimeout(()=>{b.dataset.yakin='';b.textContent='✕'},3000);return}
    const {error}=await db.from('kas_keluar').delete().eq('id',b.dataset.id);
    if(error) return toast('Gagal menghapus: '+error.message);
    toast('Pengeluaran dihapus'); muatKas();
  });
  $('form-kas').addEventListener('submit',async e=>{
    e.preventDefault();
    const {error}=await db.from('kas_keluar').insert({gudep:p.gudep,tanggal:$('k-tgl').value,keterangan:$('k-ket').value.trim(),jumlah:Math.round(+$('k-jml').value)});
    if(error) return toast('Gagal menyimpan: '+error.message);
    $('k-ket').value='';$('k-jml').value='';toast('Pengeluaran tersimpan');muatKas();
  });
})();
</script></body></html>
