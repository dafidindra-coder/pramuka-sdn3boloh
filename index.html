<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d4037">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>Login — Pramuka SDN 3 Boloh</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head><body class="hal-login">
<div class="siluet siluet-login" aria-hidden="true"></div>
<main class="login">
  <div class="login-kepala">
    <div class="siluet-pita" aria-hidden="true"></div>
    <div class="lingkar-logo"><img src="logo.png" alt="Lambang Gerakan Pramuka Pangkalan SDN 3 Boloh" width="168" height="168"></div>
  </div>
  <div class="login-isi">
  <h1>Administrasi Kepramukaan</h1>
  <p class="muted">Pangkalan SDN 3 Boloh · Gudep 05.093 Putra &amp; 05.122 Putri</p>
  <form id="form" class="card">
    <label for="nis">NIS / NIP</label>
    <input id="nis" inputmode="numeric" autocomplete="username" required>
    <label for="pw">Kata sandi</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div id="pesan" class="err" hidden></div>
    <button class="btn" id="tombol" style="margin-top:14px">Masuk</button>
  </form>
  <p class="muted salam">Satyaku kudarmakan, darmaku kubaktikan</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
