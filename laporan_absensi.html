<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d4037">
<link rel="manifest" href="manifest.json">
<title>Laporan Absensi — Pramuka SDN 3 Boloh</title>
<link rel="stylesheet" href="style.css?v=20261127c">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head><body>
<header id="nav"></header>
<main>
  <div class="tak-cetak">
    <div class="label">Absensi per kelas</div><h1>Cetak laporan absensi</h1>
  </div>
  <div class="baris-form tak-cetak">
    <div><label for="bln">Bulan</label><select id="bln"></select></div>
    <div><label for="thn">Tahun</label><input id="thn" type="number" inputmode="numeric"></div>
    <div><label for="kelas">Kelas</label><select id="kelas"></select></div>
    <div id="pilih-gudep" hidden><label for="gudep">Gudep</label><select id="gudep"><option value="">Putra & Putri</option><option value="05.093">05.093 Putra</option><option value="05.122">05.122 Putri</option></select></div>
  </div>
  <div class="baris-form tak-cetak">
    <div><label for="ttd-kiri">Penanda tangan kiri</label><input id="ttd-kiri" maxlength="60" placeholder="Nama Kepala Sekolah / Mabigus"></div>
    <div><label for="ttd-kanan">Penanda tangan kanan</label><input id="ttd-kanan" maxlength="60" placeholder="Nama Guru Kelas / Pembina"></div>
  </div>
  <div class="aksi tak-cetak">
    <button class="btn" id="cetak" type="button">Cetak / simpan PDF</button>
    <a class="btn kedua" href="rekap.html">Kembali ke Rekap</a>
  </div>
  <p class="muted tak-cetak">Pada jendela cetak, pilih printer <b>Simpan sebagai PDF</b> untuk mendapatkan file PDF. Jika memilih "Semua kelas", setiap kelas dicetak di halaman tersendiri.</p>
  <div id="laporan"></div>
</main>
<style>
  .lembar{background:#fff;color:#000;border-radius:14px;padding:18px;box-shadow:var(--bayang);font-size:.8rem}
  .lembar+.lembar{margin-top:14px}
  .kop{display:flex;align-items:center;gap:12px;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:10px}
  .kop img{width:58px;height:58px;object-fit:contain}
  .kop div{flex:1;text-align:center;line-height:1.3}
  .kop b{font-size:1rem;letter-spacing:.03em}
  .kop .kecil{font-size:.78rem}
  .judul-lap{text-align:center;font-weight:700;margin:6px 0 2px;letter-spacing:.04em}
  .meta-lap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin:8px 0}
  .tabel-lap{border-collapse:collapse;width:100%}
  .tabel-lap th,.tabel-lap td{border:1px solid #000;padding:3px 4px;font-size:.74rem;text-align:center;white-space:nowrap;color:#000;background:#fff;position:static}
  .tabel-lap th{font-weight:700;text-transform:none;letter-spacing:0;background:#eee}
  .tabel-lap td.nama{text-align:left;white-space:normal;min-width:120px}
  .tabel-lap td.A{font-weight:700}
  .tabel-lap tfoot td{font-weight:700;background:#f4f4f4}
  .ket-lap{margin-top:6px;font-size:.72rem}
  .ttd{display:flex;justify-content:space-between;gap:20px;margin-top:18px;page-break-inside:avoid}
  .ttd div{width:44%;text-align:center;line-height:1.4}
  .ttd .garis{margin-top:56px;font-weight:700;text-decoration:underline}
  .geser-lap{overflow-x:auto}
  @media print{
    @page{size:A4 portrait;margin:12mm}
    main{padding:0;max-width:none;gap:0}
    .siluet,.hak-cipta,#toast{display:none!important}
    .lembar{box-shadow:none;border-radius:0;padding:0;font-size:10pt}
    .lembar+.lembar{margin-top:0;break-before:page}
    .geser-lap{overflow:visible}
    .tabel-lap th,.tabel-lap td{font-size:8.5pt}
    .tabel-lap th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261127c"></script>
<script>
(async()=>{
  const p=await butuhLogin(['pembina','mabigus']); if(!p) return;
  const $=id=>document.getElementById(id);
  const BULAN_PANJANG=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const q=new URLSearchParams(location.search), sekarang=new Date();
  $('bln').innerHTML=BULAN_PANJANG.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
  $('bln').value=q.has('bln')?q.get('bln'):sekarang.getMonth(); $('thn').value=q.get('thn')||sekarang.getFullYear();
  if(p.role==='mabigus'){$('pilih-gudep').hidden=false;$('gudep').value=q.get('gudep')||''}
  // Nama penanda tangan diingat di perangkat ini
  const simpan=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, ambil=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  $('ttd-kiri').value=ambil('lap-ttd-kiri')||(p.role==='mabigus'?p.nama:'');
  $('ttd-kanan').value=ambil('lap-ttd-kanan')||(p.role==='pembina'?p.nama:'');

  const semuaSiswa=await ambilSiswaKelasSaya(p);
  const kelasSaya=normKelas(p.kelas), kelasDari=s=>normKelas(s.kelas)||'—';
  function isiKelas(){
    const g=p.role==='mabigus'?$('gudep').value:'', lama=$('kelas').value||q.get('kelas')||kelasSaya||'';
    const daftar=[...new Set(semuaSiswa.filter(s=>!g||s.gudep===g).map(kelasDari))].sort(urutKelas);
    $('kelas').innerHTML='<option value="">Semua kelas</option>'+daftar.map(k=>`<option value="${esc(k)}">${k==='—'?'Tanpa kelas':'Kelas '+esc(k)}${k===kelasSaya?' (kelas Anda)':''}</option>`).join('');
    $('kelas').value=daftar.includes(lama)?lama:'';
  }
  isiKelas();

  const tglPanjang=d=>{const [y,m,h]=d.split('-');return `${+h} ${BULAN_PANJANG[m-1]} ${y}`};
  async function muat(){
    const b=+$('bln').value, t=+$('thn').value, g=p.role==='mabigus'?$('gudep').value:'', kl=$('kelas').value;
    const siswa=semuaSiswa.filter(s=>(!g||s.gudep===g)&&(!kl||kelasDari(s)===kl))
      .sort((a,b)=>urutKelas(kelasDari(a),kelasDari(b))||a.nama.localeCompare(b.nama,'id'));
    const box=$('laporan');
    if(!siswa.length){box.innerHTML='<div class="kosong"><b>Belum ada siswa</b><span>Pilih kelas atau bulan lain.</span></div>';return}
    box.innerHTML='<div class="kerangka" style="min-height:300px"></div>';
    const awal=`${t}-${String(b+1).padStart(2,'0')}-01`, akhir=new Date(t,b+1,0).toLocaleDateString('en-CA');
    const ids=siswa.map(s=>s.id), data=[];
    for(let i=0;i<ids.length;i+=150){ // potong agar URL tidak terlalu panjang
      const {data:d,error}=await db.from('absensi_mingguan').select('siswa_id,tanggal,status').in('siswa_id',ids.slice(i,i+150)).gte('tanggal',awal).lte('tanggal',akhir);
      if(error){tampilError(box,'Absensi gagal dimuat',error);return} data.push(...d);
    }
    const peta=new Map(data.map(r=>[r.siswa_id+'|'+r.tanggal,r.status]));
    const perKelas=new Map(); siswa.forEach(s=>{const k=kelasDari(s);if(!perKelas.has(k))perKelas.set(k,[]);perKelas.get(k).push(s)});
    const kelasDiNama=k=>k==='—'?'Tanpa kelas':k;
    const namaGudepLap=g?`Gudep ${g} ${GUDEP[g]}`:'Gudep 05.093 Putra & 05.122 Putri';
    box.innerHTML=[...perKelas].map(([k,daftar])=>{
      const idSet=new Set(daftar.map(s=>s.id));
      const tanggal=[...new Set(data.filter(r=>idSet.has(r.siswa_id)).map(r=>r.tanggal))].sort();
      const tot={H:0,S:0,I:0,A:0}, perTgl=Object.fromEntries(tanggal.map(d=>[d,0]));
      const baris=daftar.map((s,i)=>{
        const n={H:0,S:0,I:0,A:0};
        const sel=tanggal.map(d=>{const st=peta.get(s.id+'|'+d)||'';if(st){n[st]++;tot[st]++;if(st==='H')perTgl[d]++}return `<td class="${st}">${st||'·'}</td>`}).join('');
        const isi=n.H+n.S+n.I+n.A;
        return `<tr><td>${i+1}</td><td>${esc(s.nis_nip)}</td><td class="nama">${esc(s.nama)}</td><td>${s.gudep==='05.122'?'P':'L'}</td>${sel}
          <td>${n.H}</td><td>${n.S}</td><td>${n.I}</td><td>${n.A}</td><td>${isi?Math.round(n.H/isi*100)+'%':'—'}</td></tr>`;
      }).join('');
      const semua=tot.H+tot.S+tot.I+tot.A, L=daftar.filter(s=>s.gudep!=='05.122').length;
      return `<section class="lembar">
        <div class="kop"><img src="logo.png" alt=""><div><b>GERAKAN PRAMUKA</b><br>SD NEGERI 3 BOLOH<br><span class="kecil">${esc(namaGudepLap)}</span></div><img src="logo.png" alt="" style="visibility:hidden"></div>
        <div class="judul-lap">LAPORAN ABSENSI LATIHAN PRAMUKA</div>
        <div class="meta-lap"><span>Kelas: <b>${esc(kelasDiNama(k))}</b></span><span>Bulan: <b>${BULAN_PANJANG[b]} ${t}</b></span>
          <span>Jumlah siswa: <b>${daftar.length}</b> (L ${L}, P ${daftar.length-L})</span><span>Latihan: <b>${tanggal.length} kali</b></span></div>
        <div class="geser-lap"><table class="tabel-lap">
          <thead><tr><th rowspan="2">No</th><th rowspan="2">NIS</th><th rowspan="2">Nama</th><th rowspan="2">L/P</th>
            ${tanggal.length?`<th colspan="${tanggal.length}">Tanggal latihan</th>`:''}<th colspan="4">Jumlah</th><th rowspan="2">% Hadir</th></tr>
            <tr>${tanggal.map(d=>`<th>${+d.slice(8)}/${+d.slice(5,7)}</th>`).join('')}<th>H</th><th>S</th><th>I</th><th>A</th></tr></thead>
          <tbody>${baris}</tbody>
          <tfoot><tr><td colspan="4" style="text-align:right">Jumlah hadir</td>${tanggal.map(d=>`<td>${perTgl[d]}</td>`).join('')}
            <td>${tot.H}</td><td>${tot.S}</td><td>${tot.I}</td><td>${tot.A}</td><td>${semua?Math.round(tot.H/semua*100)+'%':'—'}</td></tr></tfoot>
        </table></div>
        <div class="ket-lap">Keterangan: H = Hadir, S = Sakit, I = Izin, A = Alfa (tanpa keterangan), · = belum diisi.${tanggal.length?'':' Belum ada absensi pada bulan ini.'}</div>
        <div class="ttd">
          <div>Mengetahui,<br>Kepala Sekolah / Mabigus<div class="garis">${esc($('ttd-kiri').value)||'&nbsp;'.repeat(40)}</div></div>
          <div>Boloh, ${tglPanjang(hariIni())}<br>Guru Kelas / Pembina<div class="garis">${esc($('ttd-kanan').value)||'&nbsp;'.repeat(40)}</div></div>
        </div>
      </section>`;
    }).join('');
    document.title=`Absensi ${kl?'Kelas '+kelasDiNama(kl):'Semua Kelas'} ${BULAN_PANJANG[b]} ${t}`;
  }
  $('cetak').onclick=()=>window.print();
  $('gudep').addEventListener('change',isiKelas);
  ['bln','thn','kelas','gudep'].forEach(id=>$(id).addEventListener('change',muat));
  ['ttd-kiri','ttd-kanan'].forEach(id=>$(id).addEventListener('change',()=>{simpan('lap-'+id,$(id).value);muat()}));
  muat();
})();
</script></body></html>
