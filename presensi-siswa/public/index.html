<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A4BBF">
<meta name="author" content="Dafid Indra Jaya Ningrat">
<meta name="copyright" content="© 2026 Dafid Indra Jaya Ningrat">
<title>Presensi Siswa</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Warna diambil dari logo sekolah: biru, emas, hijau, merah api */
:root{
  --biru:#1A4BBF; --biru-tua:#0E2C7A; --biru-muda:#E8EEFC; --emas:#F5B700; --hijau:#2E9B45; --api:#E8572A;
  --kertas:#F2F5FC; --permukaan:#FFFFFF; --tinta:#14213F; --tinta-2:#5A6785;
  --garis:#DDE4F2; --garis-kuat:#B4C0DA; --utama:var(--biru); --utama-teks:#FFFFFF;
  --h:#17894A; --t:#C27400; --i:#2563EB; --s:#8B4FC2; --a:#D63A2F;
  --c-scan:#1A4BBF; --c-harian:#17894A; --c-laporan:#C27400; --c-siswa:#E8572A; --c-kartu:#8B4FC2; --c-guru:#0E8C8C; --c-pengaturan:#5A6785;
  --bayang:0 1px 2px rgba(20,33,63,.06),0 4px 14px rgba(20,33,63,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --biru:#5B8BFF; --biru-tua:#0B1F57; --biru-muda:#16264D; --emas:#F7C33A; --hijau:#4CC06A; --api:#FF7A4D;
    --kertas:#0C1430; --permukaan:#131E40; --tinta:#E8EDFA; --tinta-2:#9AA7C7;
    --garis:#24325C; --garis-kuat:#3A4B7D; --utama:#5B8BFF; --utama-teks:#0C1430;
    --h:#4CC983; --t:#F0AE3C; --i:#7AA7FF; --s:#C097EC; --a:#FF7468;
    --c-scan:#7AA7FF; --c-harian:#4CC983; --c-laporan:#F0AE3C; --c-siswa:#FF8A5C; --c-kartu:#C097EC; --c-guru:#4FD1D1; --c-pengaturan:#9AA7C7;
    --bayang:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --biru:#5B8BFF; --biru-tua:#0B1F57; --biru-muda:#16264D; --emas:#F7C33A; --hijau:#4CC06A; --api:#FF7A4D;
  --kertas:#0C1430; --permukaan:#131E40; --tinta:#E8EDFA; --tinta-2:#9AA7C7;
  --garis:#24325C; --garis-kuat:#3A4B7D; --utama:#5B8BFF; --utama-teks:#0C1430;
  --h:#4CC983; --t:#F0AE3C; --i:#7AA7FF; --s:#C097EC; --a:#FF7468;
  --c-scan:#7AA7FF; --c-harian:#4CC983; --c-laporan:#F0AE3C; --c-siswa:#FF8A5C; --c-kartu:#C097EC; --c-guru:#4FD1D1; --c-pengaturan:#9AA7C7;
  --bayang:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--kertas); color:var(--tinta);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--tinta-2)}
.kecil{font-size:.85rem}
.angka{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
.ikon{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* tombol & isian */
.btn{
  font:inherit; font-weight:700; font-size:.95rem; min-height:44px; padding:.55rem 1rem;
  border-radius:12px; border:1.5px solid var(--garis-kuat); background:var(--permukaan);
  color:var(--tinta); cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--biru)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.utama{background:var(--utama);color:var(--utama-teks);border-color:var(--utama);box-shadow:0 3px 0 var(--biru-tua)}
.btn.utama:active{box-shadow:none;transform:translateY(3px)}
.btn.emas{background:var(--emas);color:#3A2A00;border-color:var(--emas);box-shadow:0 3px 0 #C48F00}
.btn.tipis{background:transparent;border-color:transparent}
.btn.tipis:hover{background:var(--biru-muda);border-color:transparent}
.btn.bahaya{color:var(--a)}
.btn.kecil{min-height:36px;padding:.3rem .75rem;font-size:.85rem;border-radius:10px}
.lebar{width:100%}
label{display:grid;gap:.3rem;font-size:.85rem;font-weight:700;color:var(--tinta-2)}
label.cek{display:flex;align-items:flex-start;gap:.5rem;font-weight:600}
label.cek input{width:auto;min-height:0;margin-top:.2rem}
input,select,textarea{
  font:inherit; font-weight:500; color:var(--tinta); background:var(--permukaan);
  border:1.5px solid var(--garis-kuat); border-radius:12px; padding:.55rem .75rem; min-height:44px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--biru);box-shadow:0 0 0 3px color-mix(in srgb,var(--biru) 22%,transparent)}
textarea{min-height:160px;font-size:.9rem}

/* layar masuk */
.layar-tengah{
  min-height:100vh;display:grid;place-items:center;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--biru) 22%,transparent),transparent 70%),var(--kertas);
}
.kartu-form{
  width:min(420px,100%); background:var(--permukaan); border:1px solid var(--garis);
  border-radius:20px; padding:1.6rem; display:grid; gap:1rem; box-shadow:var(--bayang);
  border-top:5px solid var(--emas);
}
.kartu-form h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.logo-besar{width:96px;height:96px;justify-self:center;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(14,44,122,.25))}
.kartu-form .tengah{text-align:center;display:grid;gap:.25rem}

/* kepala aplikasi */
.kepala{
  background:linear-gradient(135deg,var(--biru) 0%,var(--biru-tua) 100%);color:#fff;position:relative;
  padding-top:env(safe-area-inset-top,0px);
}
.kepala::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--emas) 0 33.3%,var(--hijau) 33.3% 66.6%,var(--api) 66.6%)}
.kepala-dalam{
  max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:.85rem;padding-block:14px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.kepala .logo{width:52px;height:52px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.kepala-teks{min-width:0;flex:1}
.sekolah{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:#fff}
.peran{font-size:.85rem;color:#C9D6FF;font-weight:600}
.btn-kaca{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.btn-kaca:hover{background:rgba(255,255,255,.24);border-color:#fff}
nav.tab{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--kertas) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--garis);
}
.tab-dalam{
  max-width:1060px;margin:0 auto;display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding-block:.6rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.tab-dalam::-webkit-scrollbar{display:none}
nav.tab button{
  font:inherit;font-weight:700;font-size:.9rem;color:var(--warna);background:color-mix(in srgb,var(--warna) 10%,var(--permukaan));
  border:1.5px solid color-mix(in srgb,var(--warna) 25%,transparent);border-radius:999px;
  padding:.45rem .95rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:.4rem;
}
nav.tab button.aktif{background:var(--warna);border-color:var(--warna);color:var(--permukaan);box-shadow:0 3px 10px color-mix(in srgb,var(--warna) 35%,transparent)}
main{
  max-width:1060px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.judul-hal{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.35rem;display:flex;align-items:center;gap:.6rem}
.ikon-judul{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:1.15rem;
  color:var(--warna);background:color-mix(in srgb,var(--warna) 14%,var(--permukaan));
}
.alat{
  display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end;margin:1rem 0;padding:1rem;
  background:var(--permukaan);border:1px solid var(--garis);border-radius:16px;box-shadow:var(--bayang);
}
.alat label{flex:1 1 160px}
.alat .tombol{display:flex;gap:.5rem;flex-wrap:wrap}

/* status */
.st-H{--st:var(--h)} .st-T{--st:var(--t)} .st-I{--st:var(--i)} .st-S{--st:var(--s)} .st-A{--st:var(--a)} .st-B{--st:var(--tinta-2)}
.chip{
  display:inline-flex;gap:.35rem;align-items:baseline;padding:.15rem .65rem;border-radius:999px;
  font-size:.8rem;font-weight:700;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);
}
.ringkas{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.6rem;margin-bottom:.75rem}
.ringkas .chip{
  display:flex;flex-direction:column-reverse;align-items:flex-start;gap:0;border-radius:14px;padding:.65rem .9rem;
  font-size:.85rem;background:var(--permukaan);border:1px solid var(--garis);border-left:5px solid var(--st);box-shadow:var(--bayang);color:var(--tinta-2)
}
.ringkas .chip b{font-size:1.7rem;line-height:1.1;color:var(--st);font-weight:800}

/* scan */
.scan{display:grid;gap:1.25rem}
@media (min-width:780px){.scan{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.scan-kiri{display:grid;gap:.75rem}
.scan-kamera{
  position:relative;aspect-ratio:1/1;width:100%;max-width:440px;margin:0 auto;border-radius:24px;overflow:hidden;
  border:3px dashed color-mix(in srgb,var(--biru) 45%,transparent);
  background:repeating-linear-gradient(45deg,var(--biru-muda) 0 12px,var(--permukaan) 12px 24px);
  display:grid;place-items:center;
}
.scan-kamera.aktif{border-style:solid;border-color:var(--biru);background:#000}
.scan-kamera #reader{position:absolute;inset:0;width:100%;height:100%;border:0!important}
.scan-kamera #reader video{width:100%!important;height:100%!important;object-fit:cover;display:block}
.scan-kamera #reader img{display:none}
/* bingkai bidik: selalu di tengah kotak kamera */
.bidik{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;display:none;
  --s:#fff;--p:12%;--t:4px;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28);
  background:
    linear-gradient(var(--s),var(--s)) top left/var(--p) var(--t),linear-gradient(var(--s),var(--s)) top left/var(--t) var(--p),
    linear-gradient(var(--s),var(--s)) top right/var(--p) var(--t),linear-gradient(var(--s),var(--s)) top right/var(--t) var(--p),
    linear-gradient(var(--s),var(--s)) bottom left/var(--p) var(--t),linear-gradient(var(--s),var(--s)) bottom left/var(--t) var(--p),
    linear-gradient(var(--s),var(--s)) bottom right/var(--p) var(--t),linear-gradient(var(--s),var(--s)) bottom right/var(--t) var(--p);
  background-repeat:no-repeat}
.bidik span{position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--emas);box-shadow:0 0 8px var(--emas);animation:garis-scan 2.2s ease-in-out infinite alternate}
@keyframes garis-scan{from{top:10%}to{top:90%}}
.scan-kamera.aktif .bidik{display:block}
.scan-kosong{color:var(--biru);font-weight:700;padding:1rem;text-align:center;display:grid;gap:.5rem;justify-items:center}
.scan-kosong .ikon{width:56px;height:56px;stroke-width:1.6}
.scan-kamera.aktif .scan-kosong{display:none}
#btnKamera{min-height:54px;font-size:1.05rem;border-radius:14px}
.stempel{
  background:var(--permukaan);border:1px solid var(--garis);border-radius:20px;padding:1.25rem 1.25rem 1.1rem;
  min-height:190px;display:grid;align-content:start;gap:.2rem;box-shadow:var(--bayang);
}
.stempel.kosong{place-items:center;align-content:center;text-align:center;color:var(--tinta-2)}
.stempel[class*="st-"],.stempel.gagal{background:color-mix(in srgb,var(--st) 8%,var(--permukaan));border:2px solid color-mix(in srgb,var(--st) 50%,var(--garis))}
.stempel.gagal{--st:var(--a)}
.stempel-isi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:start}
.stempel-foto{width:112px;height:140px;border-radius:14px;overflow:hidden;background:var(--biru-muda);border:3px solid var(--permukaan);box-shadow:0 0 0 2px var(--st,var(--garis))}
.stempel-foto img,.stempel-foto .foto-kosong{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.stempel-foto .foto-kosong{font-size:2rem;font-weight:800;color:var(--biru)}
.stempel-info{display:grid;gap:.2rem;min-width:0}
@media (max-width:430px){.stempel-foto{width:88px;height:110px}}
.stempel-nama{font-size:clamp(1.45rem,5vw,2rem);font-weight:800;line-height:1.12;letter-spacing:-.025em;overflow-wrap:anywhere}
.stempel-judul{font-size:1.4rem;font-weight:800;color:var(--a);letter-spacing:-.02em}
.cap{
  justify-self:start;margin:.7rem 0 .35rem;padding:.2rem .95rem;border:4px double var(--st);border-radius:8px;
  color:var(--st);font-size:1.5rem;font-weight:800;letter-spacing:.01em;transform:rotate(-4deg);
}
.stempel.dup .cap{opacity:.5}
.stempel.animasi .cap{animation:cap .38s cubic-bezier(.2,1.5,.45,1)}
@keyframes cap{from{transform:rotate(-4deg) scale(1.7);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.riwayat{list-style:none;margin:0;padding:0;border:1px solid var(--garis);border-radius:16px;background:var(--permukaan);box-shadow:var(--bayang);overflow:hidden}
.riwayat li{display:grid;grid-template-columns:3.2rem 1fr auto;gap:.6rem;align-items:center;padding:.6rem .9rem;border-top:1px solid var(--garis)}
.riwayat li:first-child{border-top:0}
.riwayat .kosong{display:block;color:var(--tinta-2);text-align:center}
.sub{font-size:1rem;font-weight:800;margin:.9rem 0 .5rem}

/* buku absen */
.grup{margin-top:1.4rem}
.grup-judul{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap}
.grup-judul h3{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:.5rem}
.grup-judul h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--emas);transform:rotate(45deg)}
.buku{list-style:none;margin:0;padding:0;border:1px solid var(--garis);border-radius:16px;background:var(--permukaan);overflow:hidden;box-shadow:var(--bayang)}
.baris{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.6rem .85rem;border-top:1px solid var(--garis)}
.baris:first-child{border-top:0}
.baris .no{color:var(--tinta-2);text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem}
.baris .nama{font-weight:700;display:block;line-height:1.3;overflow-wrap:anywhere}
.seg{display:flex;gap:5px}
.seg button{
  width:42px;height:42px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--st) 35%,var(--garis));
  background:color-mix(in srgb,var(--st) 6%,transparent);color:var(--st);font:inherit;font-weight:800;cursor:pointer;
}
.seg button.aktif{background:var(--st);border-color:var(--st);color:var(--permukaan);box-shadow:0 2px 8px color-mix(in srgb,var(--st) 40%,transparent)}
.seg button:disabled{opacity:.4}
.aksi-baris{display:flex;gap:.35rem}

/* tabel */
.gulir{overflow-x:auto;border:1px solid var(--garis);border-radius:16px;background:var(--permukaan);box-shadow:var(--bayang)}
.tabel{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.tabel th,.tabel td{padding:.55rem .7rem;border-bottom:1px solid var(--garis);text-align:left;vertical-align:middle}
.tabel th{font-size:.78rem;color:var(--tinta-2);font-weight:800;white-space:nowrap;background:var(--biru-muda)}
.tabel tbody tr:last-child td{border-bottom:0}
.tabel tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--biru-muda) 40%,transparent)}
.tabel tfoot td{font-weight:800;border-top:2px solid var(--garis-kuat);border-bottom:0}
.tabel .n{text-align:right;width:3.2rem}
.persen-tidak{color:var(--a);font-weight:800;white-space:nowrap}
.tabel .n.persen-tidak{width:4.6rem}
.tabel tfoot .baris-rumus td{font-weight:500;font-size:.8rem;color:var(--tinta-2);border-top:0;padding-top:0;white-space:normal}
.tabel th.n.st-H,.tabel th.n.st-T,.tabel th.n.st-I,.tabel th.n.st-S,.tabel th.n.st-A{color:var(--st)}
.hari-efektif{margin:.25rem 0 0;background:var(--permukaan);border:1px solid var(--garis);border-radius:14px;padding:.7rem 1rem}
.hari-efektif summary{cursor:pointer;font-weight:700}
.hari-efektif ul{margin:.5rem 0 0;padding:0;list-style:none;display:grid;gap:.25rem}
.hari-efektif li{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.9rem}
.keterangan{margin-top:1rem}

/* foto siswa (formulir) */
.foto-form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.9rem;align-items:center}
.foto-pratinjau{width:88px;height:110px;border-radius:12px;overflow:hidden;background:var(--biru-muda);border:1px solid var(--garis)}
.foto-pratinjau img,.foto-pratinjau .foto-kosong{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.foto-pratinjau .foto-kosong{font-size:1.6rem;font-weight:800;color:var(--biru)}
.foto-aksi{display:grid;gap:.35rem;min-width:0}
.foto-aksi .label-teks{font-size:.85rem;font-weight:700;color:var(--tinta-2)}
.foto-aksi .tombol{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
.pilih-file{display:inline-flex;align-items:center;cursor:pointer;color:var(--tinta)}

/* kartu QR (benda cetak: warnanya tetap, tidak ikut tema) */
.kartu-grid{display:flex;flex-wrap:wrap;gap:5mm;justify-content:center;padding-block:.5rem}
.kartu-qr{
  position:relative;color:#14213F;border:1.2mm solid transparent;border-radius:3.5mm;overflow:hidden;
  background:
    linear-gradient(160deg,#EAF0FF 0%,#FFFFFF 42%,#FFFFFF 58%,#FFF3D1 100%) padding-box,
    linear-gradient(135deg,#1A4BBF 0%,#2E9B45 38%,#F5B700 68%,#E8572A 100%) border-box;
  display:grid;break-inside:avoid;box-shadow:0 3px 14px rgba(20,33,63,.16);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.kartu-qr>*{position:relative;z-index:1}
/* gambar logo sekolah buram sebagai latar di belakang identitas dan QR */
.kartu-qr>.kq-siluet{
  position:absolute;z-index:0;pointer-events:none;
  background:var(--logo) center/contain no-repeat;opacity:.22;
}
.kq-band{
  grid-area:band;color:#fff;display:flex;align-items:center;gap:2mm;padding:0 3mm;min-width:0;overflow:hidden;
  background:linear-gradient(135deg,#1A4BBF,#0E2C7A);
  border-bottom:.7mm solid #F5B700;
}
/* hiasan bulat pakai elemen vektor (bukan gradien radial) supaya tetap tajam saat dicetak */
.kq-band::before,.kq-band::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.kq-band::before{width:9mm;height:9mm;right:-3mm;bottom:-4.5mm;background:#F5B700;box-shadow:-4.2mm 2mm 0 -1.6mm #2E9B45}
.kq-band::after{width:24mm;height:24mm;right:-9mm;top:-13mm;background:rgba(255,255,255,.12)}
.kq-band>*{position:relative;z-index:1}
.kq-logo{width:9mm;height:9mm;object-fit:contain;flex:none}
.kq-band-teks{min-width:0;display:grid}
.kq-sekolah{font-size:7.5pt;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.kq-jenis{font-size:5.5pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFD34D;margin-top:.4mm}
.kq-foto{grid-area:foto;border-radius:2mm;overflow:hidden;background:#E8EEFC;border:.7mm solid #fff;box-shadow:0 0 0 .55mm #F5B700,0 .8mm 2mm rgba(14,44,122,.25)}
.kq-foto img,.kq-foto .foto-kosong{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.kq-foto .foto-kosong{font-size:12pt;font-weight:800;color:#1A4BBF}
.kq-teks{grid-area:teks;min-width:0;display:grid;align-content:center}
.kq-nama{font-size:10.5pt;font-weight:800;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere;color:#0E2C7A}
.kq-label{display:flex;flex-wrap:wrap;gap:1mm;margin-top:1mm}
.kq-kelas,.kq-nis{display:inline-block;font-size:6.8pt;font-weight:800;border-radius:5mm;padding:.35mm 1.8mm;line-height:1.3;font-variant-numeric:tabular-nums}
.kq-kelas{background:#1A4BBF;color:#fff}
.kq-nis{background:#FFE9A8;color:#6B4A00}
.kq-qr{grid-area:qr;display:grid;place-items:center;align-content:center;gap:.6mm}
.kq-qr-kotak{background:rgba(255,255,255,.92);border-radius:2mm;padding:1.4mm;box-shadow:0 0 0 .3mm #C9D5F2;display:block}
.kq-qr svg{display:block}
.kq-qr-label{font-size:5pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#2E9B45}
.kq-garis{
  grid-area:garis;display:grid;place-items:center;background:#0E2C7A;color:#FFD34D;
  font-size:5pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  border-top:.6mm solid;border-image:linear-gradient(90deg,#F5B700 0 33.3%,#2E9B45 33.3% 66.6%,#E8572A 66.6%) 1;
}
/* lanskap 8,56 × 5,4 cm */
.bentuk-lanskap .kartu-qr{
  width:85.6mm;height:54mm;
  grid-template-columns:30mm 19mm minmax(0,1fr);grid-template-rows:11mm minmax(0,1fr) 4mm;
  grid-template-areas:"band band band" "qr foto teks" "garis garis garis";
}
.bentuk-lanskap .kq-siluet{inset:12mm 0 5mm 12mm}
.bentuk-lanskap .kq-qr svg{width:22mm;height:22mm}
.bentuk-lanskap .kq-foto{width:17mm;height:21.25mm;align-self:center}
.bentuk-lanskap .kq-teks{padding:0 2.5mm 0 2.5mm}
/* potret 5,4 × 8,56 cm */
.bentuk-potret .kartu-qr{
  width:54mm;height:85.6mm;
  grid-template-columns:minmax(0,1fr);grid-template-rows:12.5mm auto auto minmax(0,1fr) 4mm;
  grid-template-areas:"band" "foto" "teks" "qr" "garis";
}
.bentuk-potret .kq-siluet{inset:27mm 0 5mm 0}
.bentuk-potret .kq-band{padding:0 2.5mm}
.bentuk-potret .kq-foto{width:19mm;height:23.75mm;justify-self:center;margin-top:2.6mm}
.bentuk-potret .kq-teks{text-align:center;padding:1.4mm 2.5mm 0}
.bentuk-potret .kq-label{justify-content:center}
.bentuk-potret .kq-qr svg{width:20.5mm;height:20.5mm}

/* kop & tanda tangan laporan cetak */
.kop{display:grid;grid-template-columns:22mm 1fr;gap:4mm;align-items:center;padding-bottom:3mm;margin-bottom:5mm;border-bottom:1.2mm double #0E2C7A}
.kop img{width:22mm;height:22mm;object-fit:contain}
.kop-sekolah{font-size:15pt;font-weight:800;color:#0E2C7A;letter-spacing:.01em;text-transform:uppercase}
.kop-judul{font-size:11.5pt;font-weight:800;margin-top:1mm}
.kop-sub{font-size:10pt;color:#333}
.tabel-cetak{width:calc(100% - 1mm);border-collapse:collapse;font-size:9.5pt;font-variant-numeric:tabular-nums}
.tabel-cetak th,.tabel-cetak td{border:.25mm solid #777;padding:1.3mm 2mm;text-align:left}
.tabel-cetak th{background:#E8EEFC;font-weight:800}
.tabel-cetak .n{text-align:center;width:9mm}
.tabel-cetak .stc{font-weight:800;color:var(--st)}
.ringkas-cetak{margin-top:3mm;font-size:9.5pt}
.ttd{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:10mm;font-size:10pt;break-inside:avoid}
.ttd>div{display:grid;gap:1mm;justify-items:center;align-content:start;text-align:center}
.ttd-ruang{height:18mm}
.ttd-garis{font-weight:700;text-decoration:underline}

/* hak cipta */
.hak-cipta{border-top:1px solid var(--garis);background:var(--permukaan);margin-top:1rem}
.hak-cipta-dalam{
  max-width:1060px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .75rem;font-size:.8rem;color:var(--tinta-2);
  padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.hak-cipta img{width:22px;height:22px;object-fit:contain;opacity:.85}
.hak-cipta b{margin-left:auto;font-weight:700;color:var(--biru)}
.hak-cipta-form{text-align:center;font-size:.75rem;font-weight:600;color:var(--tinta-2);letter-spacing:.02em}
.cetak-hak{margin-top:6mm;font-size:7.5pt;color:#888;text-align:right;letter-spacing:.02em}

/* modal & toast */
.modal-latar{position:fixed;inset:0;z-index:20;background:rgba(10,20,50,.55);display:grid;place-items:center;padding:16px}
.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:var(--permukaan);border-radius:20px;padding:1.4rem;border:1px solid var(--garis);border-top:5px solid var(--biru);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal form,.modal .isi{display:grid;gap:.9rem}
.modal h2{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.modal .aksi{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;margin-top:.25rem}
.kotak-info{background:var(--biru-muda);border:1px solid color-mix(in srgb,var(--biru) 25%,transparent);border-radius:12px;padding:.85rem;font-size:.92rem}
#toasts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:40;display:grid;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--tinta);color:var(--kertas);padding:.8rem 1rem;border-radius:14px;font-weight:600;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.error{background:var(--a);color:#fff}
.toast.ok{background:var(--h);color:#fff}
.hanya-cetak{display:none}
.kosong-besar{text-align:center;padding:2.5rem 1rem;border:2px dashed var(--garis-kuat);border-radius:16px;color:var(--tinta-2);display:grid;gap:.75rem;justify-items:center;background:var(--permukaan)}

@media (max-width:430px){
  .baris{grid-template-columns:1.6rem minmax(0,1fr)}
  .baris .seg,.baris .aksi-baris{grid-column:2}
  .seg button{width:50px}
  .kepala .logo{width:44px;height:44px}
  .sekolah{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){.stempel.animasi .cap{animation:none}.btn{transition:none}}

@page{size:A4;margin:10mm}
@media print{
  :root{--kertas:#fff;--permukaan:#fff;--tinta:#000;--tinta-2:#444;--garis:#999;--garis-kuat:#777;--biru-muda:#E8EEFC;--h:#17894A;--t:#C27400;--i:#2563EB;--s:#8B4FC2;--a:#D63A2F;color-scheme:light}
  body{background:#fff;color:#000}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print,#toasts,#modal-root{display:none!important}
  .hanya-cetak{display:block!important}
  main{max-width:none;padding:0}
  .gulir{overflow:visible;border:0;border-radius:0;box-shadow:none}
  .tabel{font-size:9.5pt}
  .tabel th,.tabel td{padding:3px 6px;border:.25mm solid #999}
  .tabel tfoot .baris-rumus td{border:0;padding-top:1.5mm}
  .laporan .grup+.grup{break-before:page}
  .lembar+.lembar{break-before:page}
  .kartu-grid{gap:1.5mm;justify-content:flex-start;padding:0}
  .kartu-qr{box-shadow:none}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>

<div id="app"><div class="layar-tengah"><p class="muted">Memuat…</p></div></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
